   style="display:flex;align-items:center;gap:7px;min-height:44px;box-sizing:border-box;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#f6f1e9;color:#9a7b4f;font:600 13px/1.2 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-decoration:none;border-bottom:1px solid rgba(44,38,32,.10);-webkit-tap-highlight-color:transparent"><span aria-hidden="true" style="font-size:15px">&#8592;</span><span>Hub</span></a>
